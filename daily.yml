name: Daily weather tracker
on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-weather
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline.py
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "Weather data $(date -u +%F)"
          git push
      - name: Update daily issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%F)
          title="Weather tracker: $day"
          gh label create weather-daily --color 0366d6 --force
          number=$(gh issue list --state all --label weather-daily --limit 100 --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file data/issue.md
            gh issue reopen "$number" || true
          else
            gh issue create --title "$title" --body-file data/issue.md --label weather-daily
          fi
          gh issue list --state open --label weather-daily --limit 100 --json number,title --jq ".[] | select(.title != \"$title\") | .number" | while read -r n; do gh issue close "$n"; done
